<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Hi, I'm Darleen</title>
  <desc id="d">E-Commerce student at THWS, building apps in my free time</desc>
  <style>
    .float{transform-box:fill-box;transform-origin:center;animation:float 6s ease-in-out infinite}
    .f2{animation-duration:7.5s;animation-delay:-2s}
    .f3{animation-duration:9s;animation-delay:-4s}
    .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
    .t2{animation-delay:-1s}
    .t3{animation-delay:-1.9s}
    .sub{opacity:0;animation:fade 1s ease-out 1.6s forwards}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.5}}
    @keyframes fade{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.float,.tw{animation:none}.sub{animation:none;opacity:1}}

.fa,.fb,.fc{animation-duration:.6s;animation-iteration-count:infinite;animation-timing-function:step-end}
.fa{animation-name:fa}.fb{animation-name:fb}.fc{animation-name:fc}
@keyframes fa{0%{opacity:1}25%,100%{opacity:0}}
@keyframes fb{0%{opacity:0}25%{opacity:1}50%{opacity:0}75%,100%{opacity:1}}
@keyframes fc{0%,25%{opacity:0}50%{opacity:1}75%,100%{opacity:0}}
.malia-move,.molly-move{transform-box:view-box;transform-origin:40px 0}
.malia-move{transform:translateX(150px);animation:malia 43.0s linear -4s infinite}
.malia-walk{animation:maliaWalk 43.0s step-end -4s infinite}
.malia-sit{opacity:0;animation:maliaSit 43.0s step-end -4s infinite}
@keyframes malia{0%{transform:translateX(-100px) scaleX(1)}17.28%,24.25%{transform:translateX(420px) scaleX(1)}53.49%{transform:translateX(1300px) scaleX(1)}53.59%{transform:translateX(1300px) scaleX(-1)}100%{transform:translateX(-100px) scaleX(-1)}}
@keyframes maliaWalk{0%{opacity:1}17.28%{opacity:0}24.25%,100%{opacity:1}}
@keyframes maliaSit{0%{opacity:0}17.28%{opacity:1}24.25%,100%{opacity:0}}
.molly-move{transform:translateX(960px);animation:molly 50.9s linear -22s infinite}
.molly-sit{opacity:0}
@keyframes molly{0%{transform:translateX(1300px) scaleX(-1)}50.00%{transform:translateX(-100px) scaleX(-1)}50.10%{transform:translateX(-100px) scaleX(1)}100%{transform:translateX(1300px) scaleX(1)}}
@media (prefers-reduced-motion:reduce){.malia-move,.molly-move,.malia-walk,.malia-sit,.fa,.fb,.fc{animation:none}.malia-walk,.molly-walk{opacity:0}.malia-sit,.molly-sit{opacity:1}}
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
    <clipPath id="wipe"><rect x="300" y="60" width="0" height="120"><animate attributeName="width" from="0" to="620" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/></rect></clipPath>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#FBEAF0"/>
  <circle class="float" cx="90" cy="70" r="46" fill="#F4C0D1"/>
  <circle class="float f2" cx="150" cy="235" r="22" fill="#F4C0D1"/>
  <circle class="float f3" cx="1105" cy="85" r="30" fill="#F4C0D1"/>
  <circle class="float f2" cx="1050" cy="230" r="54" fill="#F4C0D1"/>
  <circle class="float" cx="1140" cy="250" r="12" fill="#ED93B1"/>
  <circle class="float f3" cx="60" cy="190" r="8" fill="#ED93B1"/>
  <g fill="#D4537E">
    <path class="tw" d="M250 92 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 z"/>
    <path class="tw t2" d="M955 190 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4 z"/>
    <path class="tw t3" d="M935 70 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z"/>
  </g>
  <text clip-path="url(#wipe)" x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#72243E">Hi, I'm <tspan font-style="italic" fill="#D4537E">Darleen</tspan></text>
  <text class="sub" x="600" y="205" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#993556">E-Commerce student at THWS · building apps in my free time</text>
  <g clip-path="url(#card)"><g class="malia-move"><g class="malia-walk"><image class="fa" x="0" y="222" width="80" height="70" style="image-rendering:crisp-edges;image-rendering:pixelated" href="data:image/png;base64,"/><image class="fb" x="0" y="222" width="80" height="70" style="image-rendering:crisp-edges;image-rendering:pixelated" href="data:image/png;base64,"/><image class="fc" x="0" y="222" width="80" height="70" style="image-rendering:crisp-edges;image-rendering:pixelated" href="data:image/png;base64,"/></g><g class="malia-sit"><image x="0" y="222" width="80" height="70" style="image-rendering:crisp-edges;image-rendering:pixelated" href="data:image/png;base64,"/></g></g><g class="molly-move"><g class="molly-walk"><image class="fa" x="0" y="222" width="80" height="70" style="image-rendering:crisp-edges;image-rendering:pixelated" href="data:image/png;base64,"/><image class="fb" x="0" y="222" width="80" height="70" style="image-rendering:crisp-edges;image-rendering:pixelated" href="data:image/png;base64,"/><image class="fc" x="0" y="222" width="80" height="70" style="image-rendering:crisp-edges;image-rendering:pixelated" href="data:image/png;base64,"/></g><g class="molly-sit"><image x="0" y="222" width="80" height="70" style="image-rendering:crisp-edges;image-rendering:pixelated" href="data:image/png;base64,"/></g></g></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
