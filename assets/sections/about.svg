<text x="28" y="86" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#993556">E-Commerce student at THWS in Würzburg.</text><text x="28" y="111" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#993556">In my free time I turn everyday problems</text><text x="28" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#993556">into small, carefully designed apps,</text><text x="28" y="161" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#993556">mostly for macOS and mobile.</text>
